# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.config/tmux/tmux.conf


# Prefix + f splits left/right, making the new right pane 54 columns wide
bind f split-window -h -l 54 -c "#{pane_current_path}" \; select-pane -L

bind C-k clear-history

set-option -g history-limit 1000000

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# changing panes
bind-key h select-pane -L
bind-key l select-pane -R
bind-key j select-pane -D
bind-key k select-pane -U

# image.nvim support
set -gq allow-passthrough on
set -g visual-activity off

# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on

set-option -g pane-active-border-style "bg=default fg=magenta"
set-option -g pane-border-style "bg=default fg=white"
set -g pane-border-lines heavy
